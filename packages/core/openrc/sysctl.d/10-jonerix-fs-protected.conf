# jonerix baseline (openrc jpkg): link, FIFO and regular-file protections.
#
# Refuse to follow symlinks, or create hard links to files, owned by
# someone else in sticky world-writable directories (/tmp, /var/tmp), and
# refuse O_CREAT opens of FIFOs and regular files there that belong to
# another user.  Closes the classic /tmp symlink/hardlink races.  Same
# values as systemd's 50-default.conf; the kernel default is 0 for all four.
#
# This file belongs to the openrc package and is replaced on upgrade.
# To override a value, set it in a file that sorts later, for example
# /etc/sysctl.d/90-local.conf.
#
# One setting group per file: toybox `sysctl -p` stops reading a file at
# the first value the kernel rejects.  Comments must be on their own
# lines; toybox sysctl would write an inline "# ..." as part of the value.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 1
