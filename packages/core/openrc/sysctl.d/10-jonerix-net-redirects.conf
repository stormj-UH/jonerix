# jonerix baseline (openrc jpkg): ignore ICMP redirects.
#
# A redirect lets any on-link host that can spoof the gateway reroute
# this host's traffic.  jonerix hosts are not routers (profiles that
# forward, like router and builder, set ip_forward=1, which turns IPv4
# redirect acceptance off by itself).
#
# IPv4: on a non-forwarding host the kernel accepts a redirect when
# conf/all OR conf/<iface> allows it, so both keys are needed.  Writing
# conf/default also copies the value to interfaces that already exist
# (unless something set theirs explicitly), so eth0 is covered even
# though it appears before this file is applied.
#
# IPv6: only the per-interface value is consulted (conf/all is not) and
# conf/default is not copied to existing interfaces.  These keys cover
# every interface created after boot-time sysctl (Wi-Fi brought up
# later, VPN and container interfaces); a NIC that already exists when
# this file is applied keeps the kernel default (1) unless a
# per-interface key sets it.  A board package that knows its built-in
# NIC can add e.g. net.ipv6.conf.eth0.accept_redirects = 0.
#
# This file belongs to the openrc package and is replaced on upgrade.
# Override in a later-sorting file such as /etc/sysctl.d/90-local.conf.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
