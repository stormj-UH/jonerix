# jonerix baseline (openrc jpkg): hide kernel pointers from unprivileged
# users.
#
# 1 = %pK pointers in /proc/kallsyms, /proc/modules etc. read as zero
# unless the reader has CAP_SYSLOG.  root keeps working symbols for perf
# and crash analysis (2 would hide them from root as well).
#
# Kept in its own file because writing it needs CAP_SYS_ADMIN: inside a
# container toybox `sysctl -p` would abort on it, and nothing after it in
# the same file would be applied.
#
# This file belongs to the openrc package and is replaced on upgrade.
# Override in a later-sorting file such as /etc/sysctl.d/90-local.conf.
kernel.kptr_restrict = 1
