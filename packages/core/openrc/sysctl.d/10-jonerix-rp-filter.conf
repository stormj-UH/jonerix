# jonerix baseline (openrc jpkg): loose reverse-path filtering.
#
# 2 (RFC 3704 loose) drops packets whose source address is not reachable
# through ANY interface -- spoofed, bogon or martian sources -- without
# breaking asymmetric paths.  Strict mode (1) drops legitimate traffic on
# multi-homed hosts (a Pi on eth0 + wlan0 in the same subnet) and breaks
# Tailscale subnet/exit routing, so it is left to the router profile.
#
# The kernel uses the higher of conf/all and conf/<iface>; writing
# conf/default also updates interfaces that already exist.
#
# This file belongs to the openrc package and is replaced on upgrade.
# Override in a later-sorting file such as /etc/sysctl.d/90-local.conf.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
