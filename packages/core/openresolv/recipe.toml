[package]
name = "openresolv"
version = "3.17.4"
license = "BSD-2-Clause"
description = "resolvconf(8): lets dhcpcd, tailscaled and VPN clients share /etc/resolv.conf instead of overwriting each other"

# WHY THIS PACKAGE EXISTS
# -----------------------
# Without a resolvconf(8) implementation, dhcpcd's 20-resolv.conf hook
# writes /etc/resolv.conf itself, and it does so on every IPv6 Router
# Advertisement (hook line `elif $if_up || [ "$reason" = ROUTERADVERT ]`).
# tailscaled, finding no resolvconf, falls back to its "direct" DNS
# manager: it owns /etc/resolv.conf for MagicDNS and re-asserts it
# whenever somebody else writes it.  On jonerix-tormenta that loop ran
# every ~7 s from May to September 2026 (one RA every 7.35 s on eth0):
# ~99% of a 1.37 GB tailscaled.log and two /etc writes per cycle on the
# USB-flash root.  tailscaled only gives up after 10 tramples inside a
# 5 s window, which RA spacing never reaches.
#
# With openresolv installed:
#   - dhcpcd's hook sees `command -v resolvconf` and calls
#     `resolvconf -a <iface>` instead of writing the file.  openresolv
#     skips the rewrite when the interface data is unchanged, so an RA
#     that carries the same RDNSS/DNSSL costs nothing.
#   - tailscaled's dnsMode() picks "openresolv" (the file header says
#     "Generated by resolvconf" and `resolvconf --version` does not
#     identify as Debian) and registers MagicDNS with
#     `resolvconf -m 0 -x -a tailscale` -- exclusive, no trample watcher.
#
# tailscaled chooses its DNS mode once, at startup, so a host that was
# already fighting needs ONE tailscaled restart after this package is
# installed (post_install prints a notice; it never restarts anything
# that carries tailnet sessions).
#
# Upstream: https://github.com/NetworkConfiguration/openresolv (Roy
# Marples, same author as dhcpcd).  The vendored tarball was verified
# against the release's detached signature (openresolv-3.17.4.tar.xz.asc,
# RSA key A785 ED27 5595 5D9E 93EA 59F6 597F 97EA 9AD4 5549, the
# fingerprint published on roy.marples.name and github.com/rsmarples.gpg)
# and against GitHub's asset digest.

[source]
url = "https://github.com/NetworkConfiguration/openresolv/releases/download/v3.17.4/openresolv-3.17.4.tar.xz"
sha256 = "901d83a15520b80e117aeca8cb6f5b70ceb205ba050a638d45cebcf304df729b"

[build]
system = "custom"
# openresolv's configure is a hand-written POSIX sh script, not autoconf.
#   --sbindir=/bin            merged /bin (dhcpcd and tailscaled find it on PATH)
#   --libexecdir=/lib/resolvconf  jonerix has no /libexec; configure would
#                             otherwise probe the BUILD host for one
#   --rundir=/run             state lives in /run/resolvconf (tmpfs)
#   --mandir=/share/man       with --prefix=/ the default is "//share/man"
configure = """mksh ./configure --prefix=/ --sbindir=/bin --sysconfdir=/etc \
  --libexecdir=/lib/resolvconf --rundir=/run --mandir=/share/man
cat config.mk"""
build = "make"
install = """set -e
make DESTDIR=$DESTDIR install
if [ -d "$DESTDIR/usr" ]; then cp -a "$DESTDIR/usr/." "$DESTDIR/" && rm -rf "$DESTDIR/usr"; fi
if [ -d "$DESTDIR/sbin" ]; then cp -a "$DESTDIR/sbin/." "$DESTDIR/bin/" && rm -rf "$DESTDIR/sbin"; fi

# resolvconf is a large POSIX sh script.  Pin it to mksh the same way the
# openrc and dhcpcd recipes pin their scripts: /bin/sh can still be the
# toybox applet on hosts where a toybox reinstall re-claimed the link, and
# toybox sh cannot parse openresolv.  The subscribers in /lib/resolvconf
# are installed 0644 and sourced by resolvconf itself, so they run in
# the same mksh.
f="$DESTDIR/bin/resolvconf"
sed '1s|^#!/bin/sh|#!/bin/mksh|' "$f" > "$f.tmp"
mv "$f.tmp" "$f"
chmod 755 "$f"

# Build guards: the substituted paths are what dhcpcd, tailscaled and the
# post_install hook below rely on.
head -n 1 "$f" | grep -qx '#!/bin/mksh'
grep -q '^SYSCONFDIR=/etc$' "$f"
grep -q '^LIBEXECDIR=/lib/resolvconf$' "$f"
grep -q '^VARDIR=/run/resolvconf$' "$f"
[ -f "$DESTDIR/lib/resolvconf/libc" ]
[ -f "$DESTDIR/etc/resolvconf.conf" ]
[ -f "$DESTDIR/share/man/man8/resolvconf.8" ]
mksh -n "$f"
"$f" --version | grep -q '^openresolv 3.17.4$'"""

[hooks]
# Hand /etc/resolv.conf over to resolvconf on a live host whose running
# dhcpcd currently writes it directly (or whose copy tailscaled has
# taken over in direct mode).
#
# Guards, in order:
#   - JPKG_ROOT set to an alternate root: jpkg runs hooks on the host
#     when it cannot chroot, so never touch the host's network there.
#   - /run/openrc/softlevel missing: not a booted OpenRC system (image
#     build chroot, container).
#   - no live dhcpcd pidfile: `dhcpcd -n` signals the pid in that file
#     and, without one, would START a new dhcpcd instead.
#
# Never restart dhcpcd here: its init script `provide net`, so OpenRC
# would also restart everything that `need net` (tailscaled -> dropped
# tailnet SSH sessions).  `dhcpcd -n` asks the running daemon to rebind.
#
# openresolv's libc subscriber refuses to overwrite a resolv.conf whose
# first line is not "# Generated by resolvconf" unless it runs as
# `resolvconf -u`.  So: seed openresolv with the per-interface data
# dhcpcd has already computed (its hook-state files are exactly what it
# would pipe into `resolvconf -a`), regenerate once with -u (the old file
# is kept as /etc/resolv.conf.bak), then let dhcpcd re-register with
# metrics.  A resolv.conf written by anything else (unbound's takeover,
# a hand-written file, a container runtime's bind mount) is left alone.
post_install = '''case "${JPKG_ROOT:-/}" in
    /) ;;
    *) exit 0 ;;
esac
[ -e /run/openrc/softlevel ] || exit 0
[ -x /bin/resolvconf ] || exit 0

# Find the running dhcpcd through its own pidfile.  `dhcpcd -n` signals
# the pid in that file; with no pidfile it would START a new daemon.
#   manager mode (jonerix default, no interface on the command line):
#     <rundir>/pid
#   per-interface mode (dhcpcd_args="... eth0" in /etc/conf.d/dhcpcd):
#     <rundir>/eth0.pid, or eth0-4.pid / eth0-6.pid with -4 / -6
rundir=
rebind=
for d in /run/dhcpcd /var/run/dhcpcd; do
    for pf in "$d"/pid "$d"/*.pid; do
        [ -r "$pf" ] || continue
        p=$(cat "$pf" 2>/dev/null)
        case "$p" in
            ''|*[!0-9]*) continue ;;
        esac
        kill -0 "$p" 2>/dev/null || continue
        rundir=$d
        n=${pf##*/}
        case "$n" in
            pid) rebind="$rebind -" ;;
            *-4.pid) rebind="$rebind -4:${n%-4.pid}" ;;
            *-6.pid) rebind="$rebind -6:${n%-6.pid}" ;;
            *) rebind="$rebind ${n%.pid}" ;;
        esac
    done
    [ -n "$rundir" ] && break
done
[ -n "$rundir" ] || exit 0

head1=
[ -r /etc/resolv.conf ] && head1=$(head -n 1 /etc/resolv.conf)
takeover=0
case "$head1" in
    "# Generated by dhcpcd"*) takeover=1 ;;
    "# resolv.conf(5) file generated by tailscale"*) takeover=1 ;;
    "# Generated by resolvconf"*) ;;
    *) echo "openresolv: /etc/resolv.conf was not written by dhcpcd or tailscaled; leaving it alone (run 'resolvconf -u' to hand it to resolvconf)" ;;
esac

if [ "$takeover" = 1 ]; then
    seeded=0
    for f in "$rundir"/hook-state/resolv.conf/*; do
        [ -f "$f" ] || continue
        # libc refuses to write here (signature mismatch); the interface
        # record is still stored under /run/resolvconf.
        resolvconf -a "${f##*/}" < "$f" >/dev/null 2>&1
        seeded=$((seeded + 1))
    done
    if [ "$seeded" -gt 0 ]; then
        if resolvconf -u; then
            echo "openresolv: /etc/resolv.conf is now managed by resolvconf (previous copy: /etc/resolv.conf.bak)"
        fi
    else
        echo "openresolv: no dhcpcd resolv.conf state found; run 'resolvconf -u' once dhcpcd has rebound"
    fi
fi

# Rebind so dhcpcd re-registers every interface through resolvconf (with
# IF_METRIC ordering) from now on.
for r in $rebind; do
    case "$r" in
        -) dhcpcd -n >/dev/null 2>&1 ;;
        -4:*) dhcpcd -4 -n "${r#-4:}" >/dev/null 2>&1 ;;
        -6:*) dhcpcd -6 -n "${r#-6:}" >/dev/null 2>&1 ;;
        *) dhcpcd -n "$r" >/dev/null 2>&1 ;;
    esac
done

tpid=$(cat /run/tailscaled.pid 2>/dev/null)
case "$tpid" in
    ''|*[!0-9]*) tpid= ;;
esac
if [ -n "$tpid" ] && kill -0 "$tpid" 2>/dev/null; then
    echo "openresolv: tailscaled picks its DNS mode at startup; restart it once (rc-service tailscaled restart) to switch from direct mode to resolvconf mode"
fi
exit 0'''

# On removal dhcpcd's hook falls back to writing /etc/resolv.conf itself;
# ask the running daemon to rebind so that happens now.  tailscaled in
# resolvconf mode shells out to /bin/resolvconf and must be restarted.
post_remove = '''case "${JPKG_ROOT:-/}" in
    /) ;;
    *) exit 0 ;;
esac
[ -e /run/openrc/softlevel ] || exit 0
for d in /run/dhcpcd /var/run/dhcpcd; do
    for pf in "$d"/pid "$d"/*.pid; do
        [ -r "$pf" ] || continue
        p=$(cat "$pf" 2>/dev/null)
        case "$p" in
            ''|*[!0-9]*) continue ;;
        esac
        kill -0 "$p" 2>/dev/null || continue
        n=${pf##*/}
        case "$n" in
            pid) dhcpcd -n >/dev/null 2>&1 ;;
            *-4.pid) dhcpcd -4 -n "${n%-4.pid}" >/dev/null 2>&1 ;;
            *-6.pid) dhcpcd -6 -n "${n%-6.pid}" >/dev/null 2>&1 ;;
            *) dhcpcd -n "${n%.pid}" >/dev/null 2>&1 ;;
        esac
    done
done
if [ -S /run/tailscale/tailscaled.sock ]; then
    echo "openresolv: restart tailscaled so it stops calling resolvconf (rc-service tailscaled restart)"
fi
exit 0'''

[depends]
# /bin/resolvconf is pinned to #!/bin/mksh (see install).  Everything else
# it runs (sed, cat, mkdir, rm, printf) comes from toybox.
runtime = ["mksh", "toybox"]
build = ["make", "mksh"]
