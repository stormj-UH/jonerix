[package]
name = "reforger"
version = "0.2.3"
license = "MIT"
description = "Clean-room MIT Rust ext2/3/4 userland (mkfs.ext4, e2fsck, tune2fs, debugfs, ...)"
# reforger ships the full MIT-licensed ext4/vfat tooling. It overlaps
# with three multicall symlinks that toybox also owns (/bin/blkid,
# /bin/chattr, /bin/lsattr), and it replaces the former anvil package
# name. Claim those owners via `replaces` so jpkg transfers ownership
# transparently instead of failing the install with a file conflict.
# `replaces` only transfers files the incoming package actually installs.
replaces = ["toybox", "anvil"]

[source]
# Canonical source of truth is the Forgejo repo jonerik/reforger on
# castle.great-morpho.ts.net:3000 at commit b379e76 (Reforger rename
# plus ext4 fsck false-positive fixes). That host sits behind Tailscale
# and GitHub's cloud-hosted runners can't reach it, so the tarball is
# mirrored to a jonerix GH release (source-reforger-v0.2.3) for CI to
# fetch.
#
# 0.2.3 bugfix-and-rename: package/project is now Reforger. e2fsck no
# longer scans uninitialized inode groups, no longer treats uninitialized
# block/inode bitmaps as authoritative, and no longer feeds HTree dx_root
# blocks to the leaf directory-tail checksum verifier. This also carries
# the final upstream CI smoke-test rename away from the old project name.
#
# Forgejo URL (primary, reachable from inside the jonerix network):
#   https://castle.great-morpho.ts.net:3000/jonerik/reforger/archive/b379e76.tar.gz
url = "https://github.com/stormj-UH/jonerix/releases/download/source-reforger-v0.2.3/reforger-0.2.3.tar.gz"
sha256 = "461a420e76728710f9926d210ac6af190dcfc69c8d7d98eee67d26f7818e7b60"

[build]
system = "custom"
# Workspace-wide release build. The upstream tree is path-only with no
# registry dependencies, so --offline + --frozen asserts that cargo does
# not touch the network.
#
# -crt-static matches gitoxide / lsusb-rs: we dynamically link
# against musl so the ext4 tools use /lib/ld-musl-*.so.1 at runtime
# instead of bloating each of the 17 binaries with a static libc.
build = """
set -e
export RUSTFLAGS="-C strip=symbols -C target-feature=-crt-static"
cargo build --workspace --release --offline --frozen
"""
install = """
set -e
B=target/release

# mkfs family ------------------------------------------------------
install -Dm755 "$B/mkfs_ext4" "$DESTDIR/bin/mkfs.ext4"
ln -sf mkfs.ext4 "$DESTDIR/bin/mkfs.ext2"
ln -sf mkfs.ext4 "$DESTDIR/bin/mkfs.ext3"

# e2fsck family ----------------------------------------------------
install -Dm755 "$B/e2fsck" "$DESTDIR/bin/e2fsck"
ln -sf e2fsck "$DESTDIR/bin/fsck.ext2"
ln -sf e2fsck "$DESTDIR/bin/fsck.ext3"
ln -sf e2fsck "$DESTDIR/bin/fsck.ext4"

# mkfs.vfat (FAT12/16/32) — Cargo target name uses underscore
# because '.' is illegal there; install under the conventional
# dotted names plus the mkfs.msdos / mkdosfs aliases.
install -Dm755 "$B/mkfs_vfat" "$DESTDIR/bin/mkfs.vfat"
ln -sf mkfs.vfat "$DESTDIR/bin/mkfs.fat"
ln -sf mkfs.vfat "$DESTDIR/bin/mkfs.msdos"
ln -sf mkfs.vfat "$DESTDIR/bin/mkdosfs"

# Remaining binaries installed under their cargo bin names --------
# Keep the for-loop on a single line: jpkg runs the install script
# under mksh, whose backslash-newline handling inside a heredoc'd TOML
# string ate the '\' we had here the first time around and left
# `e2freefrag` dangling as a standalone word.
for b in dumpe2fs tune2fs debugfs resize2fs e4defrag e2image e2label e2freefrag logsave findfs filefrag blkid chattr lsattr; do
    install -Dm755 "$B/$b" "$DESTDIR/bin/$b"
done

# mklostfound: cargo can't have '+' in a bin name, so ship it as
# both mklostfound and the conventional mklost+found alias.
install -Dm755 "$B/mklostfound" "$DESTDIR/bin/mklostfound"
ln -sf mklostfound "$DESTDIR/bin/mklost+found"

# Man pages --------------------------------------------------------
for m in docs/man/*.1; do
    [ -f "$m" ] && install -Dm644 "$m" "$DESTDIR/share/man/man1/$(basename "$m")"
done
for m in docs/man/*.8; do
    [ -f "$m" ] && install -Dm644 "$m" "$DESTDIR/share/man/man8/$(basename "$m")"
done

# License tracking (same convention as lsusb-rs) ------------------
install -Dm644 LICENSE "$DESTDIR/share/licenses/reforger/LICENSE"

# merged-usr flatten + strip (same post-pass as ripgrep / lsusb-rs).
# Guard the flatten against DESTDIR unset/empty/root — jpkg < 1.0.5
# sometimes hands us DESTDIR=/, which makes `cp -a /usr/. /` copy
# /usr into itself and the whole install step dies. Skip the flatten
# in that case; each install line above already writes straight to
# /bin / /lib etc., so there's nothing to move anyway.
if [ -n "$DESTDIR" ] && [ "$DESTDIR" != "/" ]; then
    [ -d "$DESTDIR/usr"   ] && cp -a "$DESTDIR/usr/."   "$DESTDIR/"     && rm -rf "$DESTDIR/usr"
    [ -d "$DESTDIR/lib64" ] && cp -a "$DESTDIR/lib64/." "$DESTDIR/lib/" && rm -rf "$DESTDIR/lib64"
fi
# Quote the `;` terminator. Unquoted, `\\;` in the .toml gets eaten
# one level by TOML basic-string escaping and another level by the
# shell, arriving at /usr/bin/find as bare `;` and erroring with
# "find: -exec without \\;". A single-quoted `;` survives both.
find "$DESTDIR/bin" -type f -exec llvm-strip --strip-all {} ';' 2>/dev/null || true
"""

[depends]
runtime = ["musl"]
build = ["rust"]
