[package]
name = "musl"
version = "1.2.6-r3"
license = "MIT"
description = "Lightweight, fast, and standards-conformant C library"

# r1: stamp jonerix distro fingerprint into the version banner.
# Two visible surfaces:
#   - ldso usage banner (run `ld-musl-${arch}.so.1` with no args)
#     gains "musl libc (jonerix; ${arch})" instead of "musl libc (${arch})".
#   - The __libc_version[] symbol (and VERSION macro) becomes
#     "1.2.6-jonerix-${JONERIX_VERSION}" so it shows up in `strings` and
#     anyone reading the libc.so.1 ELF or calling the symbol sees it.
# These are surgical edits — no behavioural change to libc, just brand
# strings — so we don't bump dependent rebuilds.
#
# r3: post_install asks pid 1 (openrc-init) to re-exec when it still
# maps the libc this upgrade just replaced. jpkg installs by unlink +
# copy, so pid 1 kept the old, deleted libc.so mapped until halt; the
# kernel then refused to remount / read-only (EBUSY), mount-ro failed
# and the next boot replayed the ext4 journal (tormenta, 2026-05-17,
# reboots seconds after a musl reinstall). openrc 0.54-r8 does the
# same for its own files.

[source]
url = "https://musl.libc.org/releases/musl-1.2.6.tar.gz"
sha256 = "d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a"

[build]
system = "autoconf"
configure = """
# Patch ldso banner to identify as jonerix. POSIX-safe sed (no -i).
# Match the literal opening string `"musl libc (` and prepend
# `jonerix; ` inside the parens. Plain pattern, no backslash-n
# escapes — avoids any double-escape interaction with the TOML
# string parser. Verify with `grep jonerix` after the substitution
# so a future upstream wording change fails the recipe loudly.
tmp=ldso/dynlink.c.tmp
sed 's/"musl libc (/"musl libc (jonerix; /' ldso/dynlink.c > "$tmp"
cat "$tmp" > ldso/dynlink.c
rm -f "$tmp"
if ! grep -q 'musl libc (jonerix; ' ldso/dynlink.c; then
    echo "musl recipe: FATAL ldso banner patch did not apply" >&2
    grep -n 'musl libc' ldso/dynlink.c >&2 || true
    exit 1
fi
echo "musl recipe: ldso banner patched OK"

# Stamp the libc VERSION string with the distro version. Read
# /etc/os-release VERSION_ID if available; fall back to "jonerix"
# alone if the builder is mid-bootstrap and hasn't been packaged yet.
JONERIX_VERSION=jonerix
if [ -r /etc/os-release ]; then
    v=$(awk -F= '$1=="VERSION_ID"{gsub(/"/,"",$2);print $2;exit}' /etc/os-release)
    [ -n "$v" ] && JONERIX_VERSION="jonerix-$v"
fi
echo "1.2.6-${JONERIX_VERSION}" > VERSION
echo "musl: VERSION stamp = $(cat VERSION)"

CFLAGS="-Os -fomit-frame-pointer" ./configure --prefix=/ --syslibdir=/lib CC=clang
"""
build = "make -j$(nproc)"
install = """make DESTDIR=$DESTDIR install
if [ -d "$DESTDIR/usr" ]; then cp -a "$DESTDIR/usr/." "$DESTDIR/" && rm -rf "$DESTDIR/usr"; fi
if [ -d "$DESTDIR/lib64" ]; then cp -a "$DESTDIR/lib64/." "$DESTDIR/lib/" && rm -rf "$DESTDIR/lib64"; fi
# Verify the jonerix fingerprint landed in libc.so.
ok=0
for so in "$DESTDIR/lib/libc.so" "$DESTDIR"/lib/libc.musl-*.so.1; do
    [ -f "$so" ] || continue
    if strings "$so" | grep -q 'jonerix'; then
        echo "musl: jonerix fingerprint OK in $so"
        ok=1
        break
    fi
done
if [ "$ok" = "0" ]; then
    echo "musl: WARN no jonerix fingerprint found in any libc.so"
fi
find $DESTDIR/lib -name "libc.musl-*.so*" -type f -exec llvm-strip --strip-unneeded {} \\; 2>/dev/null || true"""

[hooks]
# Only on the live root with openrc-init as pid 1; a no-op in jpkg's
# chroot hook (no /run/openrc/init.ctl there, / is not pid 1's root),
# in containers and on hosts without OpenRC. The openrc-init binary is
# test-run first: as a non-init process it must reach main() and
# exit 1, or pid 1 is left alone.
post_install = """[ -z "${JPKG_ROOT:-}" ] || [ "$JPKG_ROOT" = / ] || [ ! -d "$JPKG_ROOT/etc" ] || exit 0
[ -p /run/openrc/init.ctl ] || exit 0
_p1=$(stat -L -c %d:%i /proc/1/root/ 2>/dev/null)
[ -n "$_p1" ] && [ "$_p1" = "$(stat -L -c %d:%i / 2>/dev/null)" ] || exit 0
case "$(readlink /proc/1/exe 2>/dev/null)" in
    */openrc-init|*"/openrc-init (deleted)") ;;
    *) exit 0 ;;
esac
grep -q ' (deleted)$' /proc/1/maps 2>/dev/null || exit 0
[ -x /bin/openrc-shutdown ] || exit 0
/bin/openrc-init >/dev/null 2>&1
if [ $? -ne 1 ]; then
    echo "musl: WARNING: /bin/openrc-init does not run; not re-executing pid 1. Reboot to finish the upgrade."
    exit 0
fi
echo "musl: pid 1 still maps the replaced libc; asking openrc-init to re-exec"
if command -v timeout >/dev/null 2>&1; then
    timeout 10 /bin/openrc-shutdown --reexec >/dev/null 2>&1
else
    /bin/openrc-shutdown --reexec >/dev/null 2>&1
fi || echo "musl: WARNING: re-exec request failed; / may stay read-write at the next halt until you reboot"
exit 0"""

[depends]
runtime = []
build = ["clang", "make"]
