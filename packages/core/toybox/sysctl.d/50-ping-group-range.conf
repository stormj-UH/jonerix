# Shipped by the toybox package, which provides /bin/ping.
# toybox ping only opens unprivileged SOCK_DGRAM ICMP sockets, with no
# raw-socket fallback even for root, and the kernel default "1 0" allows
# them for no group at all.  Every gid, root included, may ping.
# Override with a later-sorting file in /etc/sysctl.d/.  This file holds
# only this key because toybox sysctl -p stops at the first bad line.
net.ipv4.ping_group_range = 0 2147483647
