[package]
name = "sudo"
version = "1.9.17p2-r4"
license = "ISC"
description = "Privilege escalation utility"
# r3 (built from the unmerged lava-goat/dropbear-pq-kex branch) moved the
# setuid chmod after llvm-strip so stripping can never drop the bit.
# r4 lands that on main and adds a post_install chmod: jpkg releases up to
# 2.2.9 extract with the tar crate's default mode mask (0o777) and would
# otherwise install /bin/sudo without its setuid bit.

[source]
url = "https://www.sudo.ws/dist/sudo-1.9.17p2.tar.gz"
sha256 = "4a38a1ab3adb1199257edc2a7c4a2bd714665eb605b04368843b06dada2cfcfb"

[build]
system = "custom"
build = """set -e
GREP=/bin/grep EGREP="/bin/grep -E" FGREP="/bin/grep -F" CFLAGS="-O2 -fomit-frame-pointer" LDFLAGS="-Wl,--disable-new-dtags" ./configure --prefix=/ --bindir=/bin --sbindir=/bin --libexecdir=/lib --sysconfdir=/etc --with-rundir=/run/sudo --with-vardir=/var/db/sudo --with-logpath=/var/log/sudo.log --without-pam --without-skey --without-opie --disable-nls --disable-rpath --disable-intercept --disable-noexec --enable-static-sudoers --with-env-editor CC=clang
make -j$(nproc)
"""
install = """set -e
make DESTDIR=$DESTDIR install
if [ -d "$DESTDIR/usr" ]; then cp -a "$DESTDIR/usr/." "$DESTDIR/" && rm -rf "$DESTDIR/usr"; fi
# Merged-usr flatten for /sbin — sudo honors --sbindir=/bin but
# hand-rolled install hooks / man-page dirs / visudo have been
# observed dropping files into sbin/ on some autotools vintages.
if [ -d "$DESTDIR/sbin" ]; then cp -a "$DESTDIR/sbin/." "$DESTDIR/bin/" && rm -rf "$DESTDIR/sbin"; fi
if [ -d "$DESTDIR/lib64" ]; then cp -a "$DESTDIR/lib64/." "$DESTDIR/lib/" && rm -rf "$DESTDIR/lib64"; fi
rm -rf "$DESTDIR/share/doc" "$DESTDIR/include"
rm -f "$DESTDIR/lib/sudo/libsudo_util.a" "$DESTDIR/lib/sudo/libsudo_util.la"
find $DESTDIR/lib -name "*.la" -delete

# Strip /lib64 references from ELF files only (RPATH, DT_NEEDED,
# embedded strings — anywhere it appears in the binary). Null-pad
# /lib64 -> /lib\0\0 (same length, terminates string early). Safe:
# jonerix has no /lib64, so the padded path dereferences to /lib.
#
# IMPORTANT: only patch ELF files. The previous version walked every
# file in DESTDIR including man pages, which corrupted them when they
# legitimately mentioned /lib64 in prose. ELF magic = \x7fELF in first
# 4 bytes; cheaper than spawning python for every text file.
ELF_LIST=$(mktemp)
find "$DESTDIR" -type f -exec sh -c '
    head -c 4 "$1" 2>/dev/null | od -An -tx1 | tr -d " " | grep -q "^7f454c46" && printf "%s\n" "$1"
' _ {} \; > "$ELF_LIST" 2>/dev/null || true
if [ -s "$ELF_LIST" ]; then
    python3 - "$ELF_LIST" <<'PYEOF' || true
import sys
with open(sys.argv[1]) as f:
    files = [ln.rstrip("\n") for ln in f if ln.strip()]
for p in files:
    with open(p, "rb") as fh: d = fh.read()
    n = d.count(b"/lib64")
    if not n: continue
    d = d.replace(b"/lib64", b"/lib\x00\x00")
    with open(p, "wb") as fh: fh.write(d)
    print(f"sudo lib64-fix: {p} replaced {n} refs")
PYEOF
fi
rm -f "$ELF_LIST"

find $DESTDIR/bin -type f -exec llvm-strip --strip-all {} \; 2>/dev/null || true
find $DESTDIR/lib -name "*.so*" -type f -exec llvm-strip --strip-unneeded {} \; 2>/dev/null || true
# setuid last, after every step that may rewrite the binary.
chmod 4755 "$DESTDIR/bin/sudo"
"""

[hooks]
# Belt and braces for jpkg <= 2.2.9, whose extractor masks modes to 0o777:
# re-apply the setuid bit the archive carries. Three ways the hook runs:
#   - in place on /: JPKG_ROOT is unset or "/";
#   - host-side for an alternate root (non-root jpkg, or no /bin/sh in the
#     root yet): JPKG_ROOT names that root and the file is under it;
#   - chrooted into the alternate root (root `jpkg --root X install`, the
#     image builders' path): JPKG_ROOT is still exported as X, but inside
#     the chroot the file is at /bin/sudo.
# So use $JPKG_ROOT only when the binary is actually visible under it.
post_install = """_root=${JPKG_ROOT:-}
case "$_root" in
    /) _root= ;;
esac
[ -e "$_root/bin/sudo" ] || _root=
if [ -f "$_root/bin/sudo" ] && [ ! -L "$_root/bin/sudo" ]; then
    chmod 4755 "$_root/bin/sudo" || echo "sudo: could not set the setuid bit on $_root/bin/sudo" >&2
fi
exit 0"""

[depends]
runtime = ["musl", "libressl"]
build = ["clang", "make", "exproxide", "jonerix-headers"]
