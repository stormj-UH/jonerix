[package]
# Clean-room Rust implementation of bash 5.3 with no GNU runtime and no
# bash source-code reference.  Byte-identical with bash on 1100+ test
# corpora across the bash 5.3 upstream suite, realworld scripts, dash
# POSIX, busybox/mksh edge cases, and shellcheck/shfmt parser parity.
# Beats bash on 10/13 hot-path benchmarks (median across ITER=10).
name = "brash"
version = "1.0.26"
license = "MIT"
description = "Clean-room Rust reimplementation of bash 5.3 (no GNU runtime)"
# Brash provides /bin/bash and /bin/rash.  /bin/sh stays with mksh, which
# is the system POSIX shell on jonerix; brash is for scripts and users
# that want bashisms, associative arrays, [[ ]], etc.
#
# No `replaces` needed: jonerix has no prior /bin/bash or /bin/rash
# provider (toybox skips the bash applet, mksh installs /bin/sh).

[source]
# Canonical source: Forgejo jonerik/brash on castle.great-morpho.ts.net:3000.
# That host is behind Tailscale and unreachable from GitHub-hosted runners,
# so the tarball is mirrored to a jonerix GH release tag for CI.
#
# Forgejo URL (primary, reachable from inside the jonerix network):
#   https://castle.great-morpho.ts.net:3000/jonerik/brash/archive/v1.0.26.tar.gz
#
# The tarball here is `git archive --prefix=brash-X/` of the release commit
# plus `cargo vendor --locked vendor` and a .cargo/config.toml that points
# crates-io at vendor/, packed without macOS xattrs.  1.0.26 is Forgejo
# commit c4c02d4; its Cargo.lock differs from 1.0.18's only in brash's own
# version, so vendor/ and .cargo/ are 1.0.18's, byte for byte.
#
# 1.0.26: `set -x` no longer traces the expansion of PS4 itself, so a
# PS4 holding a command substitution prints one trace line instead of
# recursing into hundreds.  1.0.25 is Forgejo commit 34c99e4; 1.0.26 is
# c4c02d4, whose Cargo.lock differs only in brash's own version.
# 1.0.25: an EXIT trap no longer replaces the exit status (`trap cleanup
# EXIT; exit 3` exits 3, also under set -e, set -u, in ( ), $( ), & and
# pipeline elements); `exit` keeps its status through if/while conditions,
# `!` and ERR/DEBUG/signal traps, and a bare `exit` in a trap uses the
# status from before the trap; a subshell never runs the EXIT trap it
# inherited (a `trap cleanup EXIT` script no longer runs cleanup inside
# every $( ) that exits); a RETURN trap runs in full after `return` and
# keeps the function's status (`trap 'rm -f "$t"' RETURN; return 1` still
# fails); `return` ends a sourced file that also has a `shopt` line;
# prompts send no \001/\002 bytes to the terminal and \[ \] vanish
# without line editing; an interactive shell starts in emacs mode; PS3
# is printed verbatim; a root shell ignores PS4 from the environment;
# `logout N` and `--noediting` work; the shipped .brashrc falls back to
# PAGER=more; rust 1.95 builds it without warnings.  The post_install
# hook now only creates a missing ~/.brashrc or ~/.brash_profile and
# never overwrites one, and gives it the owner's primary group.
# 1.0.24: performance (dynamic-variable sync cache, regex cache, pipe
# here-docs, in-place exec of one-command subshells), a real `bind`
# engine, extglob only while enabled, real-time signals, raw-byte
# filenames, GROUPS order, locale-collated globs, ulimit table.
# 1.0.23: programmable completion matches bash (COMP_* words, COMPREPLY
# quoting, compopt, compgen -G/-C) and printf %q quoting.
# 1.0.22: [[ ]] operand rule corrected for bash-completion.
# 1.0.21: argv[0] as typed, tilde follows $HOME, process substitution
# bodies, test argument-count rules, -n no longer spins on loops.
# 1.0.20: newlines inside [[ ]] before && and || as bash reads them.
# 1.0.19: bash-completion usable (complete -D/-E/-I, compopt, compgen
# generators) and long scripts parse in linear time.
# 1.0.18: fix pending-wrap clobber on 2-row to 1-row shrink.  When
# the previous redraw left the cursor at exactly cols-character
# fill (pending-wrap state), the next redraw computed one row too
# many for old_cursor_row, emitted a spurious move-up, and wiped
# the line above the prompt.
# 1.0.17: fix history-nav redraw across multi-line entries — Up on a
# wrapping entry then Up to a shorter entry left the first row of the
# old entry visible underneath the new one.
# 1.0.16: fix line-wrap redraw (prompt reprinted on every keystroke
# past terminal width); suppress PROMPT_COMMAND from history.
# 1.0.14: fix history up-arrow bug (unmatched quote in history file
# swallowed all remaining entries into one mega-entry).
# 1.0.13: security hardening (recursion depth limits for expansion,
# functions, eval, source), SAFETY docs on all 156 unsafe blocks,
# panic audit (148 PROVEN: comments), invariant ledgers on all 9
# modules, copyright headers, perf improvements.  82/82 bash-5.3
# test suite, 128 unit tests, 18 differential corpora, zero warnings.
# 1.0.12: 82/82 bash-5.3 test suite, 18/18 test corpora green.
# Tab on a fresh empty line now rings the bell on the first press and only
# lists completions on the second consecutive Tab (matches readline's
# show-all-if-unmodified=off default), instead of immediately prompting
# "Display all N possibilities?" or dumping the whole command list.
url = "https://github.com/stormj-UH/jonerix/releases/download/source-brash-v1.0.26/brash-1.0.26.tar.gz"
sha256 = "52335df617f44eacd10c386aafe70faae1d4f07030d6f5453f9ae7c492b85db5"

[build]
system = "custom"
build = """
set -e
export CARGO_HOME=/tmp/brash-cargo
export CARGO_TARGET_DIR="$PWD/target"
# The source tarball in sources/ is repacked with Cargo vendor/ plus
# .cargo/config.toml, so this build must not touch crates.io.
export RUSTFLAGS="-C strip=symbols -C target-feature=+crt-static"
cargo build --release --frozen --offline --bin brash
"""
install = """
set -e
BIN="$PWD/target/release/brash"
install -Dm755 "$BIN" "$DESTDIR/bin/brash"
ln -sf brash "$DESTDIR/bin/bash"
ln -sf brash "$DESTDIR/bin/rash"
# Skel: drop .brashrc + .brash_profile that mirror the macOS zsh prompt.
install -Dm644 examples/dotfiles/brashrc       "$DESTDIR/share/brash/skel/.brashrc"
install -Dm644 examples/dotfiles/brash_profile "$DESTDIR/share/brash/skel/.brash_profile"
llvm-strip --strip-all "$DESTDIR/bin/brash" 2>/dev/null || true
"""

[hooks]
# Seed ~/.brashrc and ~/.brash_profile for /root and /home/* users so a
# first brash login picks up the prompt + history config without any
# manual setup.  A home that already has one of these files keeps it,
# edited or not: the hook only ever creates a missing file, and says so
# when the shipped default has moved on, so an upgrade never clobbers a
# user's prompt.  The current defaults stay in /share/brash/skel/.
post_install = """
seed_brash_rc() {
    home=$1
    owner=$2
    for base in brashrc brash_profile; do
        src=/share/brash/skel/.$base
        dest=$home/.$base
        [ -r "$src" ] || continue
        if [ -e "$dest" ] || [ -L "$dest" ]; then
            cmp -s "$src" "$dest" 2>/dev/null ||
                printf 'brash: kept %s; the new default is %s\n' "$dest" "$src"
            continue
        fi
        cp "$src" "$dest" || continue
        chown "$owner" "$dest" 2>/dev/null || true
    done
}

# A user's primary gid as /etc/passwd has it.  toybox `id -g` fails when
# that gid has no /etc/group entry, and `chown user:user` when the user has
# no group of their own name.
passwd_gid() {
    while IFS=: read -r name _ _ gid _ || [ -n "$name" ]; do
        [ "$name" = "$1" ] && { printf '%s\n' "$gid"; return 0; }
    done < /etc/passwd
    return 1
}

[ -d /root ] && seed_brash_rc /root 0:0
if [ -d /home ]; then
    for home in /home/*; do
        [ -d "$home" ] || continue
        user=$(basename "$home")
        id -u "$user" >/dev/null 2>&1 || continue
        gid=$(passwd_gid "$user") || gid=
        seed_brash_rc "$home" "$user${gid:+:$gid}"
    done
fi

# Register brash (and its /bin/bash alias) in /etc/shells so chsh,
# login(1), and any sshd that consults the file accept them as valid
# login shells. Mirrors zsh's pattern.
ensure_in_shells() {
    target=$1
    if [ -f /etc/shells ]; then
        grep -qx "$target" /etc/shells 2>/dev/null || printf '%s\n' "$target" >> /etc/shells
    else
        printf '%s\n' '# /etc/shells -- valid login shells' '/bin/sh' '/bin/mksh' "$target" > /etc/shells
    fi
}
ensure_in_shells /bin/brash
ensure_in_shells /bin/bash
ensure_in_shells /bin/rash
exit 0
"""

# On removal, jpkg already deletes /bin/brash and the /bin/bash and
# /bin/rash symlinks pointing to it.  This hook's job is only to put a
# fallback /bin/bash back so scripts with `#!/bin/bash` don't suddenly
# fail with "exec format error".  Prefer mksh (closest semantic match
# to bash among the POSIX shells on a jonerix system) and fall back to
# toybox.  If neither is available we leave /bin/bash absent — better
# an honest "command not found" than silently running the wrong shell.
post_remove = """
# Drop brash entries from /etc/shells. Leave /bin/bash alone --- the
# next block may reinstate it as a symlink to mksh/toybox, in which
# case it's still a valid login shell and chsh-eligible.
if [ -f /etc/shells ]; then
    tmp=$(mktemp /etc/shells.XXXXXX) && {
        grep -vxE '/bin/brash|/bin/rash' /etc/shells > "$tmp"
        cat "$tmp" > /etc/shells
        rm -f "$tmp"
    }
fi

if [ -e /bin/bash ] || [ -L /bin/bash ]; then
    exit 0
fi
if [ -x /bin/mksh ]; then
    ln -sf mksh /bin/bash
elif [ -x /bin/toybox ]; then
    ln -sf toybox /bin/bash
fi
exit 0
"""

[depends]
runtime = ["musl"]
build = ["rust"]
