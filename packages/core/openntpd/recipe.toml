[package]
name = "openntpd"
version = "7.9p1-r1"
license = "ISC"
description = "OpenBSD NTP daemon — lightweight, secure time synchronization"

# r1: the no-shadow fallback in post_install appended the _ntp group and
# user with printf and a doubled backslash, which reaches the shell as two
# characters: a literal backslash-n and no line terminator. The published
# builder-arm64 image has exactly that, and shadow's groupadd/useradd refuse
# an unterminated file outright, so other packages' accounts silently
# failed to appear. post_install now appends on a line of its own,
# terminates the last line before any account tool runs, reports (but does
# not rewrite) lines an older release damaged, and warns if _ntp still
# cannot be created. It also drops an adduser-safe call that only ever
# printed usage. The helpers are shared verbatim with docker.
#
# 7.9p1 (was 6.8p1-r5).  6.8p1's Linux ntpd_adjtime() slewed with
# adjtimex(ADJ_OFFSET_SINGLESHOT | ADJ_STATUS).  ADJ_OFFSET_SINGLESHOT
# includes ADJ_ADJTIME, and the kernel's ADJ_ADJTIME branch ignores
# ADJ_STATUS, so STA_UNSYNC was never cleared and every call returned
# TIME_ERROR.  ntpd read that as "not synced", re-set STA_UNSYNC, and
# stayed there: jonerix-tormenta reported "5/5 peers valid, clock
# unsynced" for 26 days with 0 ppm frequency correction, an empty drift
# file, 30 s polling forever, and (because the kernel only writes the RTC
# while synced) an RTC 231 s behind.  openntpd-portable #65 / #78.
#
# Upstream's fix is to slew with adjtime(3) again; it ships in 7.9p1,
# which also brings the other Linux fixes accumulated since 2020: kernel
# sync status updated at startup and when the clock goes unsynced, retry
# instead of abort on EACCES from recvmsg()/connect(), corrected T1/T4
# offset handling, monotonic-time handling on fast-booting systems,
# corrected NTP fixed-point conversions, and constraint DNS reset.
# Taking the release is preferred over forcing ac_cv_func_adjtimex=no on
# 6.8p1: same code path upstream now tests, plus those fixes.  The
# build guard below fails the build if the adjtimex slew ever comes back.
#
# patches/0001-ntp-port-fallback.patch: the ntp engine calls
# getservbyname("ntp", "udp") and fatal()s without an /etc/services
# entry.  No jonerix package ships /etc/services and neither the Pi image
# builder nor Dockerfile.core installs one (tormenta's is a hand-copied
# 7-line file), so a fresh image's ntpd would exit at start.  The port is
# only used for "listen on"; fall back to 123/udp.
#
# Tarball verified against openntpd-7.9p1.tar.gz.asc and the signed
# SHA256 file on cdn.openbsd.org (Brent Cook's OpenNTPD/LibreSSL release
# key A1EB 079B 8D3E B92B 4EBD 3139 663A F51B D5E4 D8D5, published there
# as libressl.asc).
[source]
url = "https://cdn.openbsd.org/pub/OpenBSD/OpenNTPD/openntpd-7.9p1.tar.gz"
sha256 = "091eeb3f4e358e28c3ab2ea58f93d7a0b5758a20d7c8a0418e162e9b2c27addc"

[build]
system = "custom"
# openntpd's configure leaks FDs and hits the default 1024 fd limit
# around configure.lineno[506] ("too many open files in shell"). Bump
# the limit for this build shell so it can finish. exproxide provides
# the /bin/expr autoconf probes expect; onetrueawk the awk that
# config.status uses.
build = """set -e
ulimit -n 65536 || true
GREP=/bin/grep EGREP="/bin/grep -E" FGREP="/bin/grep -F" \
  CC=clang LD=ld.lld \
  CFLAGS="-Os -fstack-protector-strong -fPIE -D_DEFAULT_SOURCE" \
  LDFLAGS="-fuse-ld=lld -pie" \
  ./configure --prefix=/ --sbindir=/bin --sysconfdir=/etc \
    --localstatedir=/var/db --runstatedir=/run --with-privsep-user=_ntp
jmake -j$(nproc)
# Guard: ntpd_adjtime() must slew with adjtime(3).  6.8p1's
# adjtimex(ADJ_OFFSET_SINGLESHOT|ADJ_STATUS) path never clears STA_UNSYNC.
sed -n '/^ntpd_adjtime(double d)/,/^}/p' src/ntpd.c > ntpd_adjtime.body
grep -q 'adjtime(&tv, &olddelta)' ntpd_adjtime.body
if grep -q adjtimex ntpd_adjtime.body; then echo 'openntpd: ntpd_adjtime() uses adjtimex again' >&2; exit 1; fi
if grep -q 'adjtimex returned' src/ntpd; then echo 'openntpd: binary still has the 6.8p1 adjtimex slew' >&2; exit 1; fi
# 7.9p1 derives the drift file and control socket from these dirs.
grep -q '/var/db/ntpd.drift' src/ntpd
grep -q '/run/ntpd.sock' src/ntpd"""
install = """set -e
DESTDIR=$DESTDIR jmake install
# Merged-usr flatten: autoconf honors --sbindir=/bin but hand-
# rolled install hooks can still drop into sbin/. Catch + fold.
if [ -d "$DESTDIR/usr" ]; then cp -a "$DESTDIR/usr/." "$DESTDIR/" && rm -rf "$DESTDIR/usr"; fi
if [ -d "$DESTDIR/sbin" ]; then cp -a "$DESTDIR/sbin/." "$DESTDIR/bin/" && rm -rf "$DESTDIR/sbin"; fi
if [ -d "$DESTDIR/lib64" ]; then cp -a "$DESTDIR/lib64/." "$DESTDIR/lib/" && rm -rf "$DESTDIR/lib64"; fi
# install-exec-hook creates $runstatedir; /run is a tmpfs, do not ship it.
rmdir "$DESTDIR/run" 2>/dev/null || true
mkdir -p $DESTDIR/etc
cat > $DESTDIR/etc/ntpd.conf <<EOF
# /etc/ntpd.conf — jonerix default
servers pool.ntp.org
server time.cloudflare.com
EOF
mkdir -p $DESTDIR/etc/init.d
cat > $DESTDIR/etc/init.d/ntpd <<'INITEOF'
#!/bin/openrc-run
name="ntpd"
description="OpenNTPD time synchronization daemon"
command="/bin/ntpd"
# `-d` keeps ntpd in the foreground; start-stop-daemon then backgrounds
# it with --make-pidfile so /run/ntpd.pid matches the live process.
# Without this pair, ntpd self-daemonizes, the init never learns the
# final child pid, and `rc-service ntpd status` perpetually reports
# "crashed" even when the daemon is healthy (reproduced 2026-04-16 on
# jonerix-tormenta).
command_args="-d ${NTPD_OPTS:-}"
command_background="yes"
pidfile="/run/ntpd.pid"
# With -d ntpd logs to stderr, not syslog.  Keep it: sync state changes,
# peer validity and large adjustments land here (a few lines a day).
# jonerix-logrotate caps /var/log/*.log.
output_log="/var/log/ntpd.log"
error_log="/var/log/ntpd.log"

depend() {
    need net
    before sshd tailscaled
    use dns
}

start_pre() {
    # /var/db holds the drift file.  ntpd's privileged parent (root)
    # opens and writes it; the _ntp child is chrooted to /var/empty and
    # never touches it.  /var/db also holds jpkg's package database, so
    # it must stay root-owned (up to 6.8p1-r5 this chowned it to _ntp).
    checkpath -d -m 0755 -o root:root /var/db
    checkpath -f -m 0640 -o root:root /var/log/ntpd.log
    # /var/empty is the privsep chroot — openntpd rejects anything
    # not owned by root (uid 0) with "bad privsep dir permissions".
    # Must be mode 0711 (exec-only access for others) and root-owned.
    checkpath -d -m 0711 /var/empty
}
INITEOF
chmod 755 $DESTDIR/etc/init.d/ntpd"""

[hooks]
# Register ntpd with OpenRC at install time: create the _ntp privsep user,
# prepare the state dirs, link the service into the default runlevel, and
# start it on live systems. Guard all file-touching so chroot/alt-root
# installs (jpkg --root /mnt/rootfs ...) stay idempotent.
post_install = """_who=openntpd
# >>> acct-helpers: identical in openntpd and docker post_install
# Account-file helpers. KEEP IDENTICAL in openntpd and docker post_install.
# Requires $_who (package name, for messages). Toybox-sh-safe on purpose:
# /bin/sh is toybox for a moment while an image is bootstrapped, so flat
# if/fi only -- no read loops, no traps, no nested quoting.
#
# Up to openntpd 7.9p1 and docker 27.5.1-r4 the no-shadow fallbacks wrote
# their records with printf and a doubled backslash, which reaches the shell
# as two characters: a literal backslash-n and NO line terminator. shadow's
# groupadd/useradd then refuse the whole file ("cannot open /etc/group"), and
# the next raw append glues onto the damaged line, where libc cannot see it.
# Terminating the last line is all shadow needs; appending on a line of its
# own stops the gluing. Existing damage is REPORTED, never rewritten: a
# script cannot tell a hidden record from one an admin has since re-created,
# and restoring one by name can hand a reused UID or GID to the wrong account.

# Terminate an unterminated last line (best effort: never fatal under set -e).
_end_line() {
    if [ -f "$1" ] && [ -s "$1" ] && [ -n "$(tail -c 1 "$1")" ]; then
        printf '\n' >> "$1" 2>/dev/null || true
    fi
}

# Append one record on a line of its own.
_append_record() {
    _end_line "$2"
    printf '%s\n' "$1" >> "$2"
}

# Report lines an older fallback damaged; change nothing.
_acct_check() {
    if [ -f "$1" ] && grep -qF -e '_ntp:x:123:\n' -e '_ntp:x:123:123:openntpd:/var/empty:/bin/false\n' -e 'docker:x:998:\n' "$1" 2>/dev/null; then
        echo "$_who: WARNING: $1 has records damaged by an older openntpd or docker (a literal backslash-n, perhaps with another record glued after it):"
        grep -nF -e '_ntp:x:123:\n' -e '_ntp:x:123:123:openntpd:/var/empty:/bin/false\n' -e 'docker:x:998:\n' "$1"
        echo "$_who: fix $1 by hand: delete each backslash-n and put what follows it on its own line, keeping only accounts you still want (check their IDs are not reused)."
    fi
}
# <<< acct-helpers
_acct_check /etc/group
_acct_check /etc/passwd
# shadow's groupadd/useradd refuse an unterminated last line, whoever left it.
_end_line /etc/group
_end_line /etc/passwd

# 1) _ntp privsep user + group. openntpd drops privileges to this uid
# before doing anything unprivileged. Shell structure is kept flat
# (no line-continued || chains) because toybox sh parses those
# unreliably — reproduced on jonerix-tormenta 2026-04-16 where the
# previous post_install errored "syntax error: unexpected '||'".
if ! grep -q "^_ntp:" /etc/group 2>/dev/null; then
    # toybox addgroup truncates /etc/group to 0 bytes on its
    # lookup-then-rewrite error path (reproduced 2026-05-09); use
    # shadow's groupadd (atomic) when available, fall back to a
    # safe direct append for first-boot before shadow is installed.
    if command -v groupadd >/dev/null 2>&1; then
        groupadd -r _ntp 2>/dev/null
    else
        _append_record '_ntp:x:123:' /etc/group
    fi
    grep -q "^_ntp:" /etc/group 2>/dev/null || echo "openntpd: WARNING: could not create group _ntp; ntpd will not start"
fi
if ! grep -q "^_ntp:" /etc/passwd 2>/dev/null; then
    # toybox adduser shares the same lookup-then-rewrite truncation
    # hazard as toybox addgroup. Prefer shadow's useradd (atomic) when
    # available; otherwise append directly. (Up to 7.9p1 an adduser-safe
    # branch sat here, but adduser-safe's usage is USERNAME [UID] and it
    # treats a leading "-" as a request for usage: it printed that and
    # exited 0, so on Pi hosts without shadow _ntp was never created.)
    if command -v useradd >/dev/null 2>&1; then
        useradd -r -d /var/empty -s /bin/false -g _ntp _ntp 2>/dev/null
    else
        _append_record '_ntp:x:123:123:openntpd:/var/empty:/bin/false' /etc/passwd
    fi
    grep -q "^_ntp:" /etc/passwd 2>/dev/null || echo "openntpd: WARNING: could not create user _ntp; ntpd will not start"
fi

# 2) /var/db (drift file, and jpkg's database) — root-owned, 0755.
# The drift file is written by ntpd's root parent; releases up to
# 6.8p1-r5 chowned /var/db to _ntp, which let that account rename
# /var/db/jpkg.  Take it back.
mkdir -p /var/db
chown root:root /var/db 2>/dev/null
chmod 0755 /var/db

# 3) /var/empty (privsep chroot) — MUST be root-owned with mode 0711.
# openntpd's privsep check refuses to start if the dir is not owned
# by uid 0 (errors "bad privsep dir permissions: 40XXX"). Reproduced
# 2026-04-16 when we set it _ntp-owned.
mkdir -p /var/empty
chown root:root /var/empty
chmod 0711 /var/empty

# 4) Register with OpenRC default runlevel.
if [ -d /etc/runlevels/default ]; then
    ln -sf /etc/init.d/ntpd /etc/runlevels/default/ntpd
fi

# 5) On a booted OpenRC system (not an image-build chroot, whose /run is
# empty), (re)start ntpd so an upgrade runs the new binary.  Nothing
# `need`s ntpd (tailscaled only `use`s it), so a restart stops nothing
# else.
case "${JPKG_ROOT:-/}" in
    /) ;;
    *) exit 0 ;;
esac
if [ -e /run/openrc/softlevel ] && [ -x /bin/rc-service ]; then
    if rc-service ntpd status >/dev/null 2>&1; then
        rc-service ntpd restart 2>/dev/null
    else
        rc-service ntpd start 2>/dev/null
    fi
fi
exit 0"""

post_remove = """set -e
# Stop the service first if it's running.
if [ -x /bin/rc-service ]; then
    rc-service ntpd stop 2>/dev/null || true
fi
# Unlink from the runlevel (the init.d script itself is removed by jpkg's
# normal file manifest, but the runlevel symlink is dynamic).
rm -f /etc/runlevels/default/ntpd
# Leave the _ntp user in place — removing it could orphan files.
# User can purge with: deluser _ntp; delgroup _ntp
exit 0"""

[depends]
runtime = ["musl", "libressl"]
# onetrueawk: 7.9p1's configure/config.status (newer autoconf/libtool)
# need awk; 6.8p1's did not.
build = ["clang", "jmake", "exproxide", "onetrueawk"]
