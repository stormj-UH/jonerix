[package]
name = "stormwall"
version = "1.1.15"
license = "MIT"
description = "Drop-in firewall front-end — accepts nft, pf and iptables CLI dialects against the same in-kernel netfilter backend"

[source]
# Canonical source: castle.great-morpho.ts.net:3000/jonerik/stormwall tag v1.1.15
# Mirrored to GitHub for CI (castle is behind Tailscale).
#
# 1.1.15: a state, ICMP type or reject kind stormwall cannot encode is
#   refused instead of installed as another one.
#   - `--ctstate`/`--state` names are checked. `--ctstate BOGUS -j
#     ACCEPT` exited 0 on 1.1.14 and installed
#     `ct state established,untracked accept` — the ASCII bytes of the
#     name read as the state bitmask, i.e. an ACCEPT of traffic nobody
#     asked for. The wording and exit code are iptables' own:
#     `Bad ctstate "BOGUS"` / `Bad state "BOGUS"`, exit 2. A lowercase
#     spelling is normalised so `iptables-save` prints it the way
#     iptables does.
#   - `--ctstate DNAT` and `--ctstate SNAT` are refused. Real iptables
#     lowers them to `ct status dnat|snat`, a different conntrack
#     field; stormwall has no `ct status` matcher, and OR-ing one
#     against a `ct state` list is not a single nft expression. 1.1.14
#     installed `DNAT,SNAT` as `ct state 0x0` (a rule that matched 0 of
#     2 packets in a counter test) and silently dropped the `DNAT`
#     element out of `RELATED,ESTABLISHED,DNAT`. The five states
#     stormwall does encode are unaffected.
#   - `--icmp-type`/`--icmpv6-type` resolve through iptables' own name
#     table — which is not nft's — and lower to numbers:
#     `port-unreachable` to `icmp type 3 icmp code 3`, `3/4` to
#     `icmp type 3 icmp code 4`, `any` to the protocol test alone, and
#     an unambiguous prefix (`echo-req`) the way iptables takes one.
#     1.1.14 passed the name through, so `--icmp-type bogus` installed
#     `icmp type 626f67757300`, `3/4` the ASCII of "3/4", `any` the
#     ASCII of "any", and `port-unreachable` failed with a register
#     width error. An unknown name is `Unknown ICMP type`, exit 2. A
#     negated name that pins a code is refused: `not (type 3 and code
#     3)` is not an AND of two nft clauses.
#   - `--reject-with` kinds are checked against iptables' list for the
#     family. `--reject-with bogus-thing` exited 0 on 1.1.14 and
#     installed a bare `reject`, which the kernel answers with ICMP
#     port-unreachable.
#   - The native `nft` front-end had the mirror holes: an unknown
#     `ct state` name OR'd in 0 or fell through to the raw-bytes path,
#     and an unknown `reject with` kind became a bare reject. Both are
#     unencodable tokens now, so `nft` refuses the rule.
#   - `-m dscp --dscp-class` and `-j DSCP --set-dscp-class` check the
#     class name. An unrecognised one became 0, so `--dscp-class
#     bogus` installed `ip dscp 0` — a match on unmarked traffic.
#   - `nft list ruleset` names the ICMPv6 header on an ip6 rule
#     (`icmpv6 type nd-neighbor-solicit`, not `icmp type ...`), in text
#     and JSON, so the listing feeds back through `nft -f` as the same
#     rule instead of an ICMPv4 dependency.
#   - 311 cargo tests (was 302).
#   Re-run against a live kernel (aarch64, private netns) side by side
#   with real iptables-nft 1.8.13 and real nft 1.1.6: every refusal
#   above matches iptables' exit code and message, and every command
#   that still installs reads back through the real nft as the rule
#   iptables asks for. iptables-soak.sh: 170/178 in the jonerix builder
#   container (section 18 is 28 new cases); the 8 failures are the same
#   environment and listing gaps 1.1.14 documents.
#
# 1.1.14: a match that lowers to no nft clause is refused instead of
#   installing its verdict alone.
#   - 1.1.13 refused an iptables command only when the nft TEXT it
#     lowered to held a token the nft parser could not read. A match
#     module that emitted no clause at all, or only a `comment`, parsed
#     cleanly and installed the verdict by itself: exit 0 and a `drop`
#     or `accept` of every packet. `ip6tables -A C -m hbh -j DROP`,
#     the optionless form of every other `-m <name>` (esp, ah, frag,
#     dst, mh, rt, ipv6header, socket, pkttype, physdev, time, policy,
#     u32, quota, …), and the comment-only options (`--hbh-opts`,
#     `--dst-opts`, `--fraglast`, `--fragres`, `--rt-0-res`, `--soft`,
#     `--ahlen`, `--ahres`, `-m string`) all did this. lower.rs now
#     requires every `-m <name>` to leave a real match clause behind.
#   - The native `nft` front-end had the mirror hole: an unknown `meta`
#     key fell through to NFT_META_LEN (an unknown `ct` key to
#     NFT_CT_STATE, `rt` to classid, `socket` to transparent), so
#     `nft add rule ip t c meta ibrname "eth0" drop` exited 0 and
#     installed a bare `drop`. Unknown keys are now unencodable tokens,
#     and the `nft` CLI refuses a rule that carries one the way the
#     iptables front-end already did (pf translation keeps its own
#     looser contract). Added the keys that were missing: `ct avgpkt`,
#     `ct secmark`.
#   - Refused outright, each of which used to install a bare verdict or
#     a test on the wrong field: `-m physdev` (nft's `meta ibrname` is
#     the bridge, not the member port; `--physdev-is-bridged` installed
#     `meta length != 0`, always true), `-m policy` (`meta secpath`),
#     `-m time --timestart` with no `--timestop`, `-m rt --rt-type`
#     (folded onto `rt classid`), `-m connbytes` (`ct packets` was not
#     a key, and the ordered comparators are unsupported), a bare
#     `-m hashlimit` (installed `limit rate 1/second`).
#   - Now correct rather than newly refused: `-m pkttype --pkt-type`
#     compares the one-byte PACKET_* code (it compared the name's
#     ASCII), and `-m ipv6header --header` resolves header names to
#     their IANA numbers (same bug). Both never matched before.
#   - Two forms real iptables rejects are rejected now too:
#     `--to-destination`/`--to-source` with a port and no
#     `-p tcp|udp|sctp|dccp` ("Need TCP, UDP, SCTP or DCCP with port
#     specification" — the rule port-mapped ICMP as well), and
#     `-j NOTRACK` outside the raw table.
#   - 302 cargo tests (was 296).
#   Re-run against a live kernel (aarch64, private netns) with the
#   optionless form of every `-m <name>` added to the corpus, plus the
#   1.1.13 corpus: tailscale's ipt-default set, dockerd 27 and CNI
#   replay unchanged.
#   iptables-soak.sh: 142/150 as root in the jonerix builder container
#   (was 106/119 on 1.1.13's script there, 103/119 as the reviewer ran
#   it). Section 17 is 31 new cases; 3.05, 15.11 and 15.14-15.16 were
#   converted to `expect_refused`, matching what 1.1.13 already did.
#   The script no longer needs `sudo` when it is already uid 0. The 8
#   remaining failures are environment or the documented listing gap:
#   15.12 needs nf_conntrack_ftp; 10.01 (`-D <spec>`), 11.01 (`-C`) and
#   14.01 (save/restore) need the inverse renderer; 15.04, 15.05, 15.06
#   and 15.10 are `nft list` text differences (`meta length 0x00000064`
#   for `100`, an iprange as two integers, `queue to N` for
#   `queue num N`) over rules the kernel holds correctly.
#
# 1.1.13: mark rules reach the kernel as iptables asks.
#   - `-m mark --mark V/M` lowered to `meta mark & M == V`, but the nft
#     parser read the `&` as the compare value, so the kernel held
#     `meta mark == 0x26` (same for `-m connmark`). Tailscale exit-node
#     and subnet-router masquerade and forward accept, and CNI portmap
#     hairpin masquerade, never matched. The parser now takes
#     `& | ^` / `and or xor` after a meta or ct key.
#   - `-j MARK --set-mark V/M` dropped the mask, and `meta mark set V`
#     (also `ct mark set`, `ct zone set`, `meta nftrace set`,
#     `meta priority set`) had no value source, so the kernel set the
#     key from whatever register 1 held: tailscale's
#     `-i tailscale0 -j MARK --set-mark 0x40000/0xff0000` marked
#     packets 0x6c696174 ("tail"). Setters now load an immediate or a
#     folded `and/or/xor` bitwise; --set-mark/--set-xmark masks and
#     --or-mark/--xor-mark are encoded; CONNMARK --set-xmark is its
#     own op. An iptables batch whose nft text does not parse fully is
#     refused instead of installed with tokens dropped.
#   - Listing matches nft 1.1: `meta mark & 0x00ff0000 == 0x00040000`,
#     `meta mark set meta mark & 0xff04ffff | 0x00040000`, IPv6
#     addresses in RFC 5952 form (were raw hex), JSON mangle/match
#     forms as libnftables prints them.
#   - `ip6 saddr X/N` keeps its prefix (was an exact match on X), and
#     addresses whose first group is decimal (2001:db8::1) tokenize.
#   - `-p PROTO` with no port match lowers to `meta l4proto tcp`, whose
#     `tcp` the parser took for the start of a `tcp FIELD` match that
#     also ate the verdict: `-p tcp -j DROP`, `-p udp -j NOTRACK` and
#     `-p tcp -j REJECT --reject-with tcp-reset` installed rules with
#     no protocol test and no verdict. `--syn` / `--tcp-flags` read
#     `(fin|syn|rst|ack)` as one unknown word, so the mask was 0 and
#     the rule never matched; `ALL` now expands and `!` gives `!=`.
#     `-p gre|ah|udplite|...` stored the name's first byte as the
#     protocol (gre became pim). `-m mac --mac-source 00:...` did not
#     tokenize and now lists as `ether saddr`.
#   - An unknown `ip|ip6|tcp|udp|icmp|th|ether` field is no longer
#     skipped silently, so the refusal catches it (`-f -j DROP`
#     installed a bare `drop` of every packet).
#   - A `!` reaches the option after it or the command is refused, as
#     in iptables. The `--syn` arm never took its `!` (hidden by the
#     zero mask until now), so `-m conntrack --ctstate NEW ! --syn -j
#     DROP` would have dropped every new connection, and in
#     `! --syn -m state --state NEW` the `!` moved onto --state.
#     `! --syn` and `-m addrtype ! --src-type/--dst-type` now encode
#     `!=`; `!` before owner, physdev, string, limit, statistic and
#     time options is refused. `-m owner` names and ranges are refused
#     (they parsed as id 0, root).
#   - The nft `log` statement takes `level`, `group`, `snaplen`,
#     `queue-threshold` and `flags` (it took only `prefix`), so
#     `-j LOG --log-level N|NAME` and `-j NFLOG --nflog-group N` install
#     as asked (1.1.12 dropped the level, read named levels as 0 and
#     logged NFLOG rules to the kernel log). `--log-tcp-*`,
#     `--log-ip-options`, `--log-uid` and new `--log-macdecode` become
#     `log flags ...`; NFLOG defaults to group 0 and takes
#     `--nflog-size`/`--nflog-threshold` (and `--nflog-range`, ignored).
#   - `snat to`/`dnat to` with an address the parser cannot encode
#     (IPv6, a name, a map) or a port range is refused; ip6tables
#     SNAT/DNAT to an IPv6 address installed `dnat to :0`. `snat ip to`
#     is taken, and a port-only `dnat to :PORT` lists as nft prints it.
#   - Refused with an error instead of installed wrong (each listed in
#     IPTABLES_COMPAT.md with what 1.1.12 installed): REDIRECT (any
#     form), MASQUERADE --to-ports, SNAT/DNAT port ranges and IPv6
#     addresses, TCPMSS, NFQUEUE --queue-balance, TTL --ttl-inc/-dec,
#     HL, -m connlimit, -m ttl/hl lt/gt, -m tcpmss, -p sctp/dccp with a
#     port, -m esp/ah SPIs, ip6tables -m frag/hbh/mh/dst, -f. That is
#     every command 1.1.12 accepted and 1.1.13 refuses in a 298-command
#     corpus (firewall scripts, dockerd, CNI, kube-proxy, fail2ban, ufw,
#     libvirt, wg-quick) run through both against a live kernel.
#   - 296 cargo tests (was 261); the new ones lower each command,
#     parse, encode to netlink attributes and render the listing.
#   Kernel round-trip checked in a throwaway VM (Linux 6.8, private
#   netns) against nft 1.0.9's listing and bytecode: tailscale's
#   ipt-default rule set, dockerd 27's and CNI bridge/firewall/portmap
#   rules, every LOG/NFLOG option (text and JSON listings identical),
#   and packet tests for masked MARK/mark, --or-mark, -p udp, --syn,
#   `! --syn` (a new connection passes the hardening rule
#   `--ctstate NEW ! --syn -j DROP`; the SYN-ACK is what `! --syn`
#   drops), addrtype and NFLOG (the packet arrives on the group).
#   iptables-soak.sh: 105/119 as measured on a live jonerix box with
#   sudo present and nf_conntrack_ftp loaded (1.1.11: 61/119). Without
#   those preconditions the same script scored 103/119; see 1.1.14,
#   which removes the sudo requirement.
#
# 1.1.12 (jonerix-only): repackaged 1.1.11 without the /sbin and
# /usr/sbin compat symlinks (see [hooks]).
#
# 1.1.11: parallel-worker integration — three Sonnet subagents
# implemented orthogonal feature additions in isolated worktrees, then
# the diffs were layer-merged into a single release.
#
# Match modules (10 new):
#   -m hashlimit                 (rate-limit per IP/port hash)
#                                core flags lower to nft `limit rate
#                                [over] N/unit burst B packets`; hash-
#                                config (mode/masks/htable tunables)
#                                preserved as comment markers.
#   -m policy                    (IPsec policy match)
#                                --pol ipsec → `meta secpath exists`;
#                                --pol none  → `meta secpath missing`;
#                                xfrm-specific fields (reqid/spi/proto/
#                                mode/tunnel-src/dst) preserved as
#                                comment markers.
#   -m ah                        `ah spi N`
#   -m esp                       `esp spi N`
#   -m frag                      `frag id N` / `frag length N` /
#                                `frag more-fragments 1` / `frag
#                                reserved 0`
#   -m hbh                       `hbh hdrlength N` (TLV options as comment)
#   -m mh                        `mh type N` (RFC 3775 symbolic names
#                                resolved at parse time)
#   -m rt                        `rt type T` / `rt segs-left N` /
#                                `rt hdrlength N` (rt-0-* opts as comment)
#   -m dst                       `dst hdrlength N` (TLV options as comment)
#   -m ipv6header                `ip6 nexthdr N` or `ip6 nexthdr {…}`
#                                (--soft as comment)
#
# Renderer fixes (4 round-trip bugs):
#   - `ip dscp set N` was rendered as `ip dscp 0` because the iptables
#     parser at the dscp branch consumed "set" as the value via parse_value.
#     Now detects `peek == "set"` before parse_cmp_op and emits the
#     correct Immediate + PayloadSet pair (nft format: `ip dscp set N`).
#   - `meta day { monday, friday }` previously rendered as `{ }` because
#     the AnonSet scalar parser had no weekday-name fallback. Added
#     weekday→tm_wday lookup before the integer parse, paired with
#     output.rs format_weekday_elem dispatch on NFT_META_TIME_DAY context.
#   - `numgen` was an unhandled token in parse_rule_exprs and ended up
#     as Expr::Unimplemented. Added a full `numgen (inc|random) mod M
#     [offset N]` branch that recognises the < / <= / > / >= comparators
#     parse_cmp_op doesn't, plus an Expr::Byteorder bridge to the cmp
#     operand for ordered comparisons.
#   - `fib saddr . iif oif != 0` cmp-fold path now emits ` eq ` (not
#     bare ` `) for the non-type-result EQ case, so rpfilter rules
#     round-trip through `nft list`.
#
# 21 new unit tests integrated; 261/261 cargo total (was 245).
#
# 1.1.10 (prior): -m recent + -m connbytes + meta day/hour parser fixes.
#
# Match modules added:
#   -m recent --set | --rcheck | --update | --remove
#             [--name X] [--seconds N] [--hitcount N]
#             [--rsource | --rdest]    nft set ops on a named timeout
#                                       set:
#                                         --rcheck → `ip saddr @NAME`
#                                         --set/--update → `update @NAME
#                                           { ip saddr timeout Ns }`
#                                         --remove → `delete @NAME { ip saddr }`
#                                       The named set must exist on the
#                                       host (no auto-create from the
#                                       iptables side; persistent nft.conf
#                                       is the conventional source).
#   -m connbytes --connbytes N[:M]
#                --connbytes-dir <d>
#                --connbytes-mode <m>   nft `ct {pkts|bytes|avgpkt} >= N`
#                                       (or `ct {…} N-M` for ranges).
#
# Renderer fixes (issues that surfaced when 1.1.9 -m time installed
# correctly but `nft list` showed `meta length { }` instead of
# `meta day { monday, friday }`):
#   - `meta_key()` extended to recognise "day" → NFT_META_TIME_DAY
#     and "hour" → NFT_META_TIME_HOUR. Without this, the bare "day"
#     token fell through to the (0, 4) default which collides with
#     NFT_META_LEN, so the kernel stored the rule as a length match.
#   - `parse_value()` extended to map weekday names (sunday/monday/
#     ... or sun/mon/...) to their tm_wday values (0=Sunday … 6=Saturday)
#     when reading `meta day { monday, friday }`-style anon-set
#     elements. Without this the kernel got `[0, 0]` instead of
#     `[1, 5]`, and the rule matched no days.
#
# 5 new unit tests; 245/245 cargo total.
#
# 1.1.9 (prior): Tier 2 expansion — TOS/DSCP/TTL/HL/statistic/connlimit/
# helper/time/rpfilter matches + CLASSIFY/CHECKSUM/NETMAP/SET targets.
# 1.1.8 (prior): CONNMARK register-width fix. — TOS/DSCP/TTL/HL match modules and
# their corresponding target families, plus -m statistic, -m connlimit,
# -m helper (distinct from -j CT --helper), -m time, -m rpfilter, and
# the CLASSIFY / CHECKSUM / NETMAP / SET targets.
#
# Match modules added:
#   -m tos --tos N[/M]            nft `ip dscp N`
#   -m dscp --dscp N |
#           --dscp-class CLASS    nft `ip dscp N` (class names BE/EF/AFxx/CSx
#                                  pre-resolved at parse time)
#   -m ttl --ttl-eq|gt|lt N       nft `ip ttl == N` / `> N` / `< N`
#   -m hl  --hl-eq|gt|lt N        IPv6 sibling of ttl
#   -m statistic --mode random
#                  --probability F nft `numgen random mod 1e9 < F*1e9`
#                                  (probability stored as ppb to keep
#                                  the AST `Eq`-friendly)
#                --mode nth
#                  --every N
#                  --packet P     nft `numgen inc mod N == P`
#   -m connlimit --connlimit-above|upto N
#                [--connlimit-mask M]
#                [--connlimit-saddr|--connlimit-daddr]
#                                 nft `ct count over|le N` — install
#                                 currently fails on jonerix kernel
#                                 (nft_connlimit loaded; bare inline
#                                 form needs a stateful object on this
#                                 kernel-config; tracked as a known
#                                 limitation in IPTABLES_COMPAT.md)
#   -m helper --helper "ftp"     nft `ct helper "ftp"` (disambiguated
#                                 from -j CT --helper via in_module
#                                 parser state)
#   -m time --timestart hh:mm[:ss]
#           --timestop hh:mm[:ss]
#           [--weekdays days]    nft `meta hour "..."-"..."` plus
#                                 optional `meta day { … }`
#   -m rpfilter [--invert]       nft `fib saddr . iif oif != 0`
#                                 (`eq 0` for --invert)
#
# Targets added:
#   -j TOS --set-tos|--and|--or|--xor-tos N
#                                 nft `ip dscp set N` for Set; And/Or/Xor
#                                 lower to comment markers (no nft form)
#   -j DSCP --set-dscp N |
#           --set-dscp-class C   nft `ip dscp set N`
#   -j TTL --ttl-set|dec|inc N   nft `ip ttl set N` /
#                                 `ip ttl set ip ttl - N` / `+ N`
#   -j HL --hl-set|dec|inc N     nft `ip6 hoplimit set N` (and ± N)
#   -j CLASSIFY --set-class M:N  nft `meta priority set 0xM:0xN`
#   -j CHECKSUM --checksum-fill  comment marker (kernel auto-fills on egress)
#   -j NETMAP --to PREFIX        nft `dnat to PREFIX` (POSTROUTING → snat)
#   -j SET --add-set|--del-set NAME dirs
#                                 nft `add @NAME { ip saddr [. ip daddr] }`
#                                 / `delete @NAME { … }`
#
# 17 new unit tests (240/240 cargo total). Real-kernel install
# verified for tos / dscp / ttl / statistic / time / rpfilter and
# both directions of connmark (which 1.1.8 rounded out). connlimit
# documented as a known limitation pending the stateful-object form.
#
# 1.1.8 (prior): CONNMARK register-width fix — complete bidirectional
# `meta mark set ct mark and M` round-trip.
# 1.1.7 (prior): CONNMARK --nfmask / --ctmask masks parsed and lowered.
# 1.1.6 (prior): STORMWALL_TEST_MODE=iptables drop-in for tailscaled. 1.1.7's parser made
# `meta mark set ct mark and M` parse, but the resulting expression
# chain had a register-width mismatch — Expr::Ct/Bitwise picked
# NFT_REG32_00 via reg_for_width(4) while Expr::MetaSet hard-codes
# NFT_REG_1. The kernel accepted the rule but the renderer couldn't
# decode it AND (more seriously) the meta-set portion was silent on
# packets because the bytes lived in the wrong register relative to
# what the kernel's nft_meta_set_eval reads.
#
# Two new explicit-register expression variants — Expr::CtReg and
# Expr::MetaReg — let parse_meta_set_source pin the source-side load
# to NFT_REG_1 unambiguously. Mirrors the existing BitwiseReg pattern.
# Adds Expr::CtSet (NFTA_CT_SREG=NFT_REG_1) for the symmetric write
# direction, plus a `ct KEY set <expr>` parser branch that 1.1.7
# missed (the comment in the meta arm referenced a "parallel ct set
# path" that wasn't actually wired up).
#
# Renderer (output.rs) also extended: the meta-SREG and ct-SREG arms
# now consume the preceding ct/meta + bitwise context to print the
# combined `meta KEY set ct KEY and MASK` (and symmetric) form. The
# previous behaviour was emitting empty rule bodies. format_mask_native_u32
# helper turns the kernel's CPU-native mask bytes back into `0x….` text.
#
# Net: tailscale's connmark slicing is now fully bidirectional and
# `nft list ruleset` matches what was installed via iptables. CONNMARK
# without masks (1.1.6 path) and the 1.1.7 mask parsing both still
# pass through the unchanged ConnmarkOp lowering arms.
#
# 1.1.7 (prior): parse `-j CONNMARK --save-mark/--restore-mark --nfmask V
# --ctmask V` mask sub-options.  Tailscale's healthcheck installs
# `-t mangle -I PREROUTING 1 -m conntrack --ctstate ESTABLISHED,RELATED
# -j CONNMARK --restore-mark --nfmask 0xff0000 --ctmask 0xff0000` and
# 1.1.6 rejected the masks as unknown flags, breaking `tailscale up`.
# The fix has two halves:
#   - iptables/lower.rs: emit the masked nft form `meta mark set ct
#     mark and 0xff0000` (and the symmetric `ct mark set meta mark
#     and ...` for save-mark).  ctmask wins on save / nfmask wins on
#     restore when both are set to different values — matches
#     iptables-translate's preference for the dominant-direction mask.
#   - parser.rs (nft text parser): teach the `meta KEY set <expr>` /
#     `ct KEY set <expr>` shapes to consume `ct/meta KEY [and MASK]`
#     on the right-hand side, emitting the corresponding Ct/Meta load
#     plus an Expr::Bitwise.  Without this the lowered text round-
#     tripped to a rule with no terminal verdict (kernel got just the
#     conntrack match), so the iptables call returned 0 but tailscaled
#     still saw the connmark rule missing.
# The strictly-correct multi-statement nft form
# `(ct mark & ~ctmask) | (meta mark & nfmask)` is left for follow-up;
# the symmetric-mask common case (which tailscale uses) is satisfied
# by the simpler `and <mask>` emit.
#
# 1.1.6 (prior): STORMWALL_TEST_MODE=iptables impersonation for
# tailscaled / firewalld / NetworkManager / docker libnetwork
# version-string parsers.
# parsing `iptables --version` (tailscaled, firewalld, NetworkManager,
# docker libnetwork) accept us as a drop-in.  test_mode() now returns
# a TestMode enum (Off/Nft/Iptables); STORMWALL_TEST_MODE=1 still
# means Nft for back-compat.  The iptables-family dispatch path
# (basename-resolved via /bin/iptables → /bin/stormwall) auto-sets
# STORMWALL_TEST_MODE=iptables when unset, so `iptables --version`
# emits the byte-exact `iptables vMAJOR.MINOR.PATCH (backend)` format
# that tailscaled's `iptables\\s+v(\\d+)\\.(\\d+)\\.(\\d+)` regex
# requires.  Without this, tailscaled refuses to start with
# "failed to extract iptables version from [stormwall iptables ...]".
#
# Impersonates iptables 1.8.10 with backend "nf_tables".  Manual
# `STORMWALL_TEST_MODE=iptables stormwall ...` also works for tests
# that want to drive the impersonation path directly without going
# through the iptables symlink.
#
# 1.1.5 (prior): feature-completeness pass guided by upstream
# iptables-extensions(8)
# and wiki.nftables.org translation tables (descriptive docs only — no
# GPL source consulted, per the project's clean-room policy). Adds:
#
#   Operations:
#     -E / --rename-chain        nft `rename chain <fam> <table> <old> <new>`
#     -c / --set-counters        compat-parsed (no nft equivalent)
#     -X with no chain argument  enumerates user chains via NFT_MSG_GETCHAIN
#                                and emits delete chain for each non-builtin
#
#   Targets:
#     -j NOTRACK                 nft `notrack`
#     -j NFQUEUE [--queue-num N | --queue-balance LO:HI]
#                  [--queue-bypass] [--queue-cpu-fanout]
#                                nft `queue num N[-HI] [bypass[,fanout]]`
#     -j TCPMSS --set-mss N      nft `tcp option maxseg size set N`
#     -j TCPMSS --clamp-mss-to-pmtu
#                                nft `tcp option maxseg size set rt mtu`
#     -j CT --notrack | --helper X | --zone N
#                                nft `notrack` / `ct helper set "X"` / `ct zone set N`
#     SNAT/DNAT/MASQUERADE --random-fully
#                                nft `fully-random` flag (modern NAT randomisation)
#     LOG --log-tcp-sequence | --log-tcp-options | --log-ip-options | --log-uid
#                                nft `log flags tcp sequence,options` /
#                                `log flags ip options` (uid → comment marker)
#
#   Match modules:
#     -m iprange --src-range LO-HI / --dst-range LO-HI
#                                nft `ip saddr LO-HI` / `ip daddr LO-HI`
#     -m length --length N[:M]   nft `meta length N[-M]`
#     -m pkttype --pkt-type X    nft `meta pkttype X`
#     -m connmark --mark V[/M]   nft `ct mark [and M] V` (distinct from -m mark)
#     -m tcpmss --mss N[:M]      nft `tcp option maxseg size N[-M]`
#
# 19 new unit tests covering each addition; 220/220 cargo tests pass.
# All shapes match the canonical translations in the nftables wiki's
# "Quick reference: nftables in 10 minutes" and the iptables-extensions
# man page on manpages.debian.org (descriptive references only).
#
# 1.1.4 (prior): REJECT no-args + port range parser + legacy `-s ! V`.
# 1.1.3 (prior): jump-target user-chain auto-create + `ct state { … }`.
# 1.1.2 (prior): user-chain auto-create on the operating chain.
# 1.1.1 (prior): help-text refresh.
url = "https://github.com/stormj-UH/jonerix/releases/download/source-stormwall-v1.1.15/stormwall-1.1.15.tar.gz"
sha256 = "a3da828b2ee3c2b087daf3154f944f7d63fcf9e0e844099eefbac70b7096738d"

[build]
system = "custom"
build = """
set -e
export CARGO_HOME=/tmp/stormwall-cargo
export CARGO_TARGET_DIR="$PWD/target"
export CARGO_NET_OFFLINE=true
export RUSTFLAGS="-C strip=symbols -C target-feature=+crt-static"
cargo build --release --frozen --offline --bin stormwall --bin pfctl
"""
install = """
set -e
install -Dm755 "$PWD/target/release/stormwall" "$DESTDIR/bin/stormwall"
install -Dm755 "$PWD/target/release/pfctl" "$DESTDIR/bin/pfctl"
# Single-binary dispatch by argv[0]: stormwall switches between
# nft, iptables, ip6tables, and the *-save / *-restore variants
# based on its invocation name. The symlinks below put the
# expected binary names on PATH so dockerd's libnetwork (and any
# other tool that shells out to iptables) finds a working tool.
ln -sf stormwall "$DESTDIR/bin/nft"
ln -sf stormwall "$DESTDIR/bin/iptables"
ln -sf stormwall "$DESTDIR/bin/iptables-save"
ln -sf stormwall "$DESTDIR/bin/iptables-restore"
ln -sf stormwall "$DESTDIR/bin/ip6tables"
ln -sf stormwall "$DESTDIR/bin/ip6tables-save"
ln -sf stormwall "$DESTDIR/bin/ip6tables-restore"
install -Dm644 LICENSE "$DESTDIR/share/licenses/stormwall/LICENSE"
llvm-strip --strip-all "$DESTDIR/bin/stormwall" 2>/dev/null || true
llvm-strip --strip-all "$DESTDIR/bin/pfctl" 2>/dev/null || true
"""

[hooks]
# 1.1.12: dropped the /sbin and /usr/sbin iptables compat symlinks
# from stormwall's own hooks.  Those exist solely for dockerd's
# libnetwork (which hard-codes /usr/sbin/iptables and /sbin/iptables
# instead of using PATH), so they belong in the *docker* package, not
# stormwall.  Co-shipped with docker 27.5.1-r3 which plants those
# symlinks in its own post_install and removes them in post_remove.
# Non-docker hosts no longer get /sbin/ created at all — keeps the
# rootfs flat the way jonerix wants it.
post_remove = """set -e
# Defensive cleanup: stormwall 1.1.11 and older planted symlinks in
# /sbin and /usr/sbin.  Remove them on removal so old installs upgrading
# to >=1.1.12 don't leave the /sbin tree behind when stormwall is
# removed without docker first.
names="iptables iptables-save iptables-restore ip6tables ip6tables-save ip6tables-restore nft"
for d in /sbin /usr/sbin; do
    for n in $names; do
        target=$(readlink "$d/$n" 2>/dev/null) || continue
        [ "$target" = "/bin/stormwall" ] && rm -f "$d/$n"
    done
    # If the dir is empty after we cleaned ours up, get rid of it too —
    # jonerix doesn't want a stub /sbin sitting around.
    rmdir "$d" 2>/dev/null || true
done
"""

[depends]
runtime = ["musl"]
build = ["rust"]
