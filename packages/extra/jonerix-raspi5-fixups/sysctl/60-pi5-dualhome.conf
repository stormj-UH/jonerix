# jonerix-raspi5-fixups: ARP behaviour for a Pi 5 with Ethernet and Wi-Fi
# up on the same subnet.
#
# By default Linux answers ARP for any local address on any interface and
# may source ARP requests from the "wrong" interface's address, so peers
# learn wlan0's MAC for eth0's IP (ARP flux) and traffic flips between the
# two links. Answer only for addresses configured on the receiving
# interface, and announce with the best-matching local address.
# Harmless on a single-homed host.
#
# One setting per line, no inline comments: toybox sysctl -p stops at the
# first line it rejects.
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.all.arp_ignore = 1
