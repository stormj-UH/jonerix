# jonerix-raspi5-fixups: reboot 10 s after a kernel panic instead of hanging.
#
# A headless Pi that panics otherwise sits dead until someone pulls the
# power. With this set, the board comes back on its own and the next boot
# trace records the reset (watchdog-style PM_RSTS rather than power-on).
#
# kernel.panic_on_oops is deliberately left at the kernel default (0): with
# no pstore backend on the Pi 5, turning a survivable oops into a panic
# would reboot before syslogd can write the oops to disk.
kernel.panic = 10
