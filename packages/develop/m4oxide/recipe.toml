[package]
name = "m4oxide"
version = "0.1.3-r0"
license = "MIT"
description = "Clean-room Rust implementation of m4 for jonerix"

[source]
# Canonical source: castle.great-morpho.ts.net:3000/jonerik/m4oxide v0.1.3,
# mirrored as source-m4oxide-v0.1.3 (same convention as jonerix-mlfq).
#
# 0.1.3: autoconf's GNU M4 probe accepts m4oxide.
#   - Empty input (empty stdin, an empty include file) panicked with an
#     index out of bounds (exit 134); the probe runs
#     `m4 -F conftest.m4f </dev/null`.
#   - `patsubst(a,\(b\)\|\(a\),\1)`: a backreference to a group that
#     did not take part in the match now expands to nothing silently, as
#     GNU m4 does (it warned "sub-expression 1 not present", and any
#     stderr output fails the probe). A reference past the regex's last
#     group still warns. tormenta's /bin/m4oxide is a hand-patched 0.1.2
#     that silences every missing backreference (out-of-range ones too)
#     and still panics on empty input.
url = "https://github.com/stormj-UH/jonerix/releases/download/source-m4oxide-v0.1.3/m4oxide-0.1.3.tar.gz"
sha256 = "aa9ff1b83eebac3df038a9ffb7cefee42c3f1184869dfe247fe09a3e576ee8a3"

[build]
system = "custom"
build = """
set -e
export CARGO_HOME=/tmp/m4oxide-cargo
export CARGO_TARGET_DIR="$PWD/target"
# Repo policy: zero rustc warnings (also enforced by #![deny(warnings)] at the
# crate root). crt-static for a fully musl-static binary. Cargo.toml ships a
# fat-LTO release profile so cargo build --release just consumes it.
export RUSTFLAGS="-C strip=symbols -C target-feature=+crt-static -D warnings"
cargo test --frozen --offline
cargo build --release --frozen --offline --bin m4oxide
"""
install = """
set -e
BIN="$PWD/target/release/m4oxide"
install -Dm755 "$BIN" "$DESTDIR/bin/m4oxide"
ln -sf m4oxide "$DESTDIR/bin/m4"
llvm-strip --strip-all "$DESTDIR/bin/m4oxide" 2>/dev/null || true
"""

[depends]
runtime = ["musl"]
build = ["rust"]
