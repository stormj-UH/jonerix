# /etc/sysctl.d/60-router-tcp-bbr.conf — congestion control and default
# qdisc for the `router` profile.
#
# BBR fights bufferbloat in the modem on the WAN uplink.  Pair with
# NET_SCH_CAKE on the WAN interface for a complete fq_codel-style
# setup.
#
# Its own file because both writes fail when tcp_bbr / sch_cake are
# neither built in nor loadable, and toybox `sysctl -p` stops reading a
# file at the first rejected write -- in 60-router.conf that used to
# skip every IPv6 setting after it.
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = cake
