# /etc/sysctl.d/60-builder-tcp-bbr.conf — congestion control for the
# `builder` profile.
#
# Defaults-friendly congestion control on the build host's outbound
# (npm/cargo pulls go faster).  Its own file because the write fails
# (EINVAL) when tcp_bbr is neither built in nor loadable, and toybox
# `sysctl -p` stops reading a file at the first rejected write.
net.ipv4.tcp_congestion_control = bbr
