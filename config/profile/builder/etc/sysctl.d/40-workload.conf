# /etc/sysctl.d/40-workload.conf — container-host tuning for the
# `builder` profile: containerised Node.js / Python services on musl.
#
# Moved here from config/defaults/etc/sysctl.d/jonerix.conf, which
# every image was meant to receive.  This is workload policy, not a
# distro baseline, and it does not belong on Pi or desktop installs.
# The distro baseline (fs.protected_*, kptr_restrict, ICMP redirects,
# rp_filter) is shipped by the openrc package as
# /etc/sysctl.d/10-jonerix-*.conf; the unprivileged-ping range by
# toybox.
#
# Sorts before 60-builder.conf, so the builder values win where both
# set a key.  Dropped in the move:
#   - net.ipv4.ip_local_port_range = 1024 65535: outbound connections
#     could occupy ports that local daemons bind later (3000, 5432,
#     8080...).  The kernel's 32768-60999 stays.
#   - kernel.sysrq = 0: removed serial-break SysRq on headless boards.
#   - fs.file-max, kernel.pid_max, kernel.threads-max caps: they can
#     only lower the kernel's RAM-scaled defaults on big hosts; the
#     builder profile raises them instead.
#   - vm.overcommit_memory, vm.max_map_count, inotify limits: already
#     set (higher) in 60-builder.conf.
#   - the security block: dmesg_restrict, kptr_restrict=2,
#     bpf_jit_harden=2 and perf_event_paranoid=3 now live in the minimal
#     profile (60-minimal-hardening.conf); builder deliberately opens
#     perf and BPF up (60-builder-bpf.conf).  unprivileged_bpf_disabled=1
#     was dropped (a one-way latch until reboot that made builder's own
#     "= 0" fail; kernels built with BPF_UNPRIV_DEFAULT_OFF already
#     default to 2), as was randomize_va_space=2 (the kernel default).
#   - net.ipv4.ping_group_range: shipped by the toybox package.
#
# All keys below are plain integers the kernel accepts on any jonerix
# kernel, so they share one file.

# =========================================================================
# Memory
# =========================================================================

# Low swappiness — prefer keeping application pages in RAM.
# Containerized workloads should avoid swap; 10 is a good safety net
# that still allows the kernel to swap under extreme pressure.
vm.swappiness = 10

# Reclaim dentry/inode caches more aggressively — containerized apps
# rarely benefit from large VFS caches.
vm.vfs_cache_pressure = 150

# =========================================================================
# Network
# =========================================================================

# Max listen backlog (the kernel default since 5.4; explicit for older
# kernels).  Increase for high-connection-rate reverse proxies.
net.core.somaxconn = 4096

# TCP keepalive — detect dead connections faster.
# Default 7200s (2hr) is too slow for containerized microservices.
# 60s idle, 10s interval, 6 probes = dead connection detected in ~2 min.
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# TCP SYN backlog — per-socket SYN queue for connection bursts.
net.ipv4.tcp_max_syn_backlog = 4096

# Enable TCP fast open for both client and server.
net.ipv4.tcp_fastopen = 3

# Reuse TIME_WAIT sockets for new outbound connections (the kernel
# default, 2, only does it for loopback).
net.ipv4.tcp_tw_reuse = 1

# Larger default and max socket buffers for streaming and large HTTP
# responses.
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# =========================================================================
# Container-specific notes
# =========================================================================
# The following settings are relevant but NOT sysctl-configurable.
# They must be set via environment variables or container runtime flags:
#
# Node.js V8 heap:
#   NODE_OPTIONS="--max-old-space-size=<MB>"  (default: ~1.5GB)
#   UV_THREADPOOL_SIZE=<N>  (default: 4, max: 1024; set to CPU count)
#
# Python:
#   PYTHONHASHSEED=random  (enabled by default, ASLR for dict ordering)
#   PYTHONUNBUFFERED=1     (disable stdout buffering in containers)
#   PYTHONDONTWRITEBYTECODE=1  (skip .pyc in read-only containers)
#
# Container runtime (set on host or in compose/k8s):
#   --ulimit nofile=1048576:1048576
#   --pids-limit=4096                (per-container PID limit via cgroup)
#   --memory=<bytes>                 (cgroup memory limit)
#   --cpus=<N>                       (cgroup CPU limit)
