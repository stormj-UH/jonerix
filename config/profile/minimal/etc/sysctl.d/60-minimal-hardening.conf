# /etc/sysctl.d/60-minimal-hardening.conf — kernel hardening for the
# `minimal` profile (cloud VMs, container guests, recovery images).
#
# Moved here from config/defaults/etc/sysctl.d/jonerix.conf.  These are
# stricter than the distro baseline (openrc's 10-jonerix-*.conf) and
# suit a single-purpose server nobody debugs interactively; they are not
# applied to Pi or desktop installs.
#
# Every key needs CAP_SYS_ADMIN (or is host-only), so the group has its
# own file: where the write is refused, toybox `sysctl -p` stops here
# instead of skipping the rest of 60-minimal.conf.

# dmesg only for CAP_SYSLOG (root).
kernel.dmesg_restrict = 1

# Hide kernel pointers from everyone, root included (baseline is 1).
kernel.kptr_restrict = 2

# Constant blinding for every BPF JIT user.
net.core.bpf_jit_harden = 2

# No perf_event_open(2) for unprivileged users.  Upstream kernels treat
# any value above 2 like 2; Debian-patched kernels read 3 as "deny all".
kernel.perf_event_paranoid = 3
